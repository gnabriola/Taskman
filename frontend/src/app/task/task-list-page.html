<section class="mx-auto flex max-w-2xl flex-col gap-6 p-8">
  <h1 class="text-2xl font-semibold">{{ projectName() }}</h1>

  <app-add-task-form (add)="add($event)" />

  @if (store.error(); as error) {
    <p role="alert" class="text-sm text-red-600">{{ error }}</p>
  }
  @if (addedNotice(); as notice) {
    <p role="status" class="text-sm text-gray-600">{{ notice }}</p>
  }

  @if (store.loading()) {
    <p class="text-sm text-gray-500">Loading…</p>
  } @else {
    <ul class="divide-y divide-gray-100">
      @for (task of store.tasks(); track task.id) {
        <li appTaskItem [task]="task" [now]="now()"></li>
      } @empty {
        <li class="py-2 text-sm text-gray-500">No open tasks. Nice!</li>
      }
    </ul>
  }
</section>
